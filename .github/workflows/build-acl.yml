name: Build HA Core with ACL patches

on:
  schedule:
    # Check for new releases daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "HA version to build (e.g., 2026.5.0). Leave empty to auto-detect latest."
        required: false
        type: string
      force:
        description: "Force rebuild even if already built"
        required: false
        type: boolean
        default: false

env:
  BASE_IMAGE_VERSION: "2026.01.0"
  ACL_BRANCH: "acl-patches"
  MACHINES: '["generic-x86-64", "raspberrypi4-64", "raspberrypi5-64"]'

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  check-release:
    name: Check for new HA release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Detect latest stable release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(gh api repos/home-assistant/core/releases/latest --jq '.tag_name')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Check if we already built this version
          BUILT_TAG="acl-built-${VERSION}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested for ${VERSION}"
          elif gh api "repos/${{ github.repository }}/git/refs/tags/${BUILT_TAG}" > /dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Already built ${VERSION}, skipping"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: ${VERSION}"
          fi

  rebase-patches:
    name: Rebase ACL patches onto release
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.rebase.outputs.sha }}
    steps:
      - name: Checkout ACL patches branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ACL_BRANCH }}
          fetch-depth: 0
          # Rebasing onto a release pulls in upstream's .github/workflows/*,
          # which the default GITHUB_TOKEN may not push. Use a PAT carrying the
          # workflow scope so the force-push of acl-patches succeeds.
          token: ${{ secrets.ACL_PUSH_TOKEN }}

      - name: Rebase ACL patches onto release and push
        id: rebase
        run: |
          git config user.name "ACL Builder"
          git config user.email "acl-builder@users.noreply.github.com"
          # Reuse recorded conflict resolutions across rebases.
          git config rerere.enabled true
          git config rerere.autoupdate true

          VERSION="${{ needs.check-release.outputs.version }}"

          # Bring in the upstream release tag to rebase onto.
          git remote add upstream https://github.com/home-assistant/core.git
          git fetch --no-tags upstream tag "$VERSION"

          # Restore the shared rerere cache (branch rerere-cache) so conflicts
          # resolved before replay automatically here.
          rr="$(git rev-parse --git-path rr-cache)"
          mkdir -p "$rr"
          if git fetch origin rerere-cache 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C "$rr" || true
          fi

          # Persist newly recorded resolutions back to the shared cache.
          save_rerere() {
            local idx tree commit parent=""
            if git fetch origin rerere-cache 2>/dev/null; then
              git archive FETCH_HEAD | tar -x -C "$rr" || true
              parent="-p FETCH_HEAD"
            fi
            idx="$(mktemp)"; rm -f "$idx"
            GIT_INDEX_FILE="$idx" git --work-tree="$rr" add -A 2>/dev/null \
              || { rm -f "$idx"; return 0; }
            tree="$(GIT_INDEX_FILE="$idx" git write-tree)"; rm -f "$idx"
            commit="$(git commit-tree "$tree" $parent -m "Update shared rerere cache")"
            git push origin "$commit:refs/heads/rerere-cache" || true
          }

          # Replay the ACL commits on top of the new release, keeping a clean
          # linear series. rerere auto-resolves conflicts it has seen before;
          # we only stop (and fail) for genuinely new, unresolved conflicts.
          ok=true
          if ! git rebase "$VERSION"; then
            guard=0
            while [ -d "$(git rev-parse --git-path rebase-merge)" ] \
               || [ -d "$(git rev-parse --git-path rebase-apply)" ]; do
              guard=$((guard + 1))
              if [ "$guard" -gt 100 ]; then ok=false; break; fi
              if [ -n "$(git diff --diff-filter=U --name-only)" ]; then
                ok=false; break
              fi
              git add -A
              GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || true
            done
          fi

          if [ "$ok" = true ]; then
            save_rerere
            git push origin "${{ env.ACL_BRANCH }}" --force-with-lease
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Rebased ${{ env.ACL_BRANCH }} onto $VERSION"
          else
            git rebase --abort 2>/dev/null || true
            echo "Rebase has conflicts rerere could not resolve; manual resolution required."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate translations
        run: |
          pip install orjson
          python3 -m script.translations develop --all

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: patched-source
          path: .
          retention-days: 1

  build-frontend:
    name: Build ACL frontend wheel
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Determine the frontend version this core release pins
        id: pin
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          # acl-patches never repins the frontend, so the upstream release tag
          # is the source of truth. The wheel must carry this exact version so
          # the Dockerfile's pre-stage install satisfies requirements_all.txt's
          # `home-assistant-frontend==<version>` pin and our build is kept.
          FE=$(curl -fsSL \
            "https://raw.githubusercontent.com/home-assistant/core/${VERSION}/requirements_all.txt" \
            | awk -F'==' '/^home-assistant-frontend==/{print $2; exit}')
          if [ -z "$FE" ]; then
            echo "Could not find the home-assistant-frontend pin for ${VERSION}"
            exit 1
          fi
          echo "frontend_version=${FE}" >> "$GITHUB_OUTPUT"
          echo "Core ${VERSION} pins frontend ${FE}"

      - name: Checkout ACL frontend
        uses: actions/checkout@v4
        with:
          repository: davefx/frontend
          ref: feature/acl-panel
          token: ${{ secrets.ACL_PUSH_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Stamp the wheel version to match the core pin
        run: |
          FE="${{ steps.pin.outputs.frontend_version }}"
          # The hardcoded version in pyproject.toml reflects the branch base;
          # override it so the produced wheel == the version core expects.
          sed -i -E "s/^version[[:space:]]*=.*/version = \"${FE}\"/" pyproject.toml
          grep -E '^version' pyproject.toml

      - name: Build frontend wheel
        run: |
          corepack enable
          python3 -m pip install --upgrade build
          # script/release runs: yarn install -> build_frontend -> python -m build.
          # It reads the (now stamped) version from pyproject.toml.
          script/release
          ls -la dist/

      - name: Upload frontend wheel
        uses: actions/upload-artifact@v4
        with:
          name: frontend-wheel
          path: dist/home_assistant_frontend-*.whl
          retention-days: 1

  build-base:
    name: Build base (${{ matrix.arch }})
    needs: [check-release, rebase-patches, build-frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Download patched source
        uses: actions/download-artifact@v4
        with:
          name: patched-source

      - name: Stage the ACL frontend wheel for the Docker build
        uses: actions/download-artifact@v4
        with:
          name: frontend-wheel

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-homeassistant:${{ needs.check-release.outputs.version }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-homeassistant-base:${{ env.BASE_IMAGE_VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  build-machines:
    name: Build ${{ matrix.machine }}
    needs: [check-release, build-base]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - machine: generic-x86-64
            arch: amd64
            runner: ubuntu-24.04
          - machine: raspberrypi4-64
            arch: aarch64
            runner: ubuntu-24.04-arm
          - machine: raspberrypi5-64
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Download patched source
        uses: actions/download-artifact@v4
        with:
          name: patched-source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push machine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./machine/${{ matrix.machine }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.machine }}-homeassistant:${{ needs.check-release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.machine }}-homeassistant:stable
          build-args: |
            BUILD_FROM=ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-homeassistant:${{ needs.check-release.outputs.version }}

  publish-manifest:
    name: Publish version manifest
    needs: [check-release, build-machines]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ACL_BRANCH }}

      - name: Generate version.json
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          OWNER="${{ github.repository_owner }}"

          cat > version.json << MANIFEST
          {
            "homeassistant": {
              "generic-x86-64": "${VERSION}",
              "raspberrypi4-64": "${VERSION}",
              "raspberrypi5-64": "${VERSION}"
            },
            "images": {
              "core": "ghcr.io/${OWNER}/{machine}-homeassistant"
            }
          }
          MANIFEST

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          exclude_assets: |
            .github
            homeassistant
            tests
            machine
            rootfs
            requirements*.txt
            Dockerfile*
            pyproject.toml
            script

      - name: Tag as built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/acl-built-${VERSION}" \
            -f sha="${{ github.sha }}" || true

  notify-failure:
    name: Notify on rebase failure
    needs: [check-release, rebase-patches]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Report rebase conflict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          BODY="The ACL branch (\`${{ env.ACL_BRANCH }}\`) failed to rebase cleanly onto HA Core \`${VERSION}\`. Manual resolution is needed.

          **Steps to fix (resolve once; rerere replays it next time):**
          1. \`git config rerere.enabled true\` (one-time, so the resolution is recorded)
          2. \`git fetch fork && git fetch --no-tags upstream tag ${VERSION}\`
          3. \`git checkout ${{ env.ACL_BRANCH }}\`
          4. \`git rebase ${VERSION}\`
          5. Resolve conflicts, then \`git rebase --continue\`
          6. Push the recorded resolution to the shared cache: \`../rerere-cache.sh save\` (workspace helper)
          7. \`git push fork ${{ env.ACL_BRANCH }} --force-with-lease\`
          8. Re-run the workflow — CI restores the cache and auto-resolves this conflict"

          # Always surface the runbook in the run summary (works even when
          # repo issues are disabled).
          {
            echo "## Rebase conflict: ACL patches on ${VERSION}"
            echo ""
            echo "${BODY}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Best-effort issue; ignore failure if issues are disabled on the repo.
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Rebase conflict: ACL patches on ${VERSION}" \
            --body "${BODY}" || echo "Could not open an issue (issues may be disabled); see the run summary above."
